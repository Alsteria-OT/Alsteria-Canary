name: Release Build

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "cmake/**"
      - "vcpkg.json"
      - "CMakeLists.txt"
      - "CMakePresets.json"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build & Release (Windows x64)
    runs-on: windows-2025
    env:
      VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite;nugettimeout,600"
      VCPKG_NUGET_API_KEY: ${{ github.token }}
      SCCACHE_DIR: ${{ github.workspace }}\.sccache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Get vcpkg baseline
        shell: pwsh
        run: |
          $json = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          $vcpkgCommitId = $json.'builtin-baseline'
          "VCPKG_GIT_COMMIT_ID=$vcpkgCommitId" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Remove Windows pre-installed MySQL
        shell: pwsh
        run: Remove-Item -Recurse -Force C:\mysql* -ErrorAction SilentlyContinue

      - name: Prepare sccache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:SCCACHE_DIR | Out-Null

      - name: CCache (sccache)
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          max-size: "1G"
          variant: "sccache"
          key: ccache-windows-release
          restore-keys: |
            ccache-windows

      - name: Setup NuGet source for GitHub Packages
        shell: pwsh
        env:
          NUGET_AUTH_TOKEN: ${{ github.token }}
        run: |
          $feed = "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          $nuget = (Get-Command nuget.exe -ErrorAction SilentlyContinue).Source
          if (-not $nuget) { throw "nuget.exe not found in PATH" }
          & $nuget sources remove -Name "GitHubPackages" | Out-Null 2>$null
          & $nuget sources add `
            -Name "GitHubPackages" `
            -Source $feed `
            -UserName "${{ github.repository_owner }}" `
            -Password "$env:NUGET_AUTH_TOKEN" `
            -StorePasswordInClearText
          & $nuget setapikey "$env:NUGET_AUTH_TOKEN" -Source $feed

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitURL: "https://github.com/microsoft/vcpkg.git"
          vcpkgGitCommitId: ${{ env.VCPKG_GIT_COMMIT_ID }}

      - name: Build (CMake Release)
        uses: lukka/run-cmake@v10
        with:
          configurePreset: windows-release
          buildPreset: windows-release
          configurePresetAdditionalArgs: "['-DTOGGLE_BIN_FOLDER=ON']"

      - name: Generate release tag
        id: tag
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyy.MM.dd"
          $sha  = "${{ github.sha }}".Substring(0, 7)
          $tag  = "build-$date-$sha"
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Zip binary output
        shell: pwsh
        run: |
          $binDir = "build/windows-release/bin"
          Compress-Archive -Path "$binDir\*" -DestinationPath "alsteria-canary-windows-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Alsteria Canary — ${{ steps.tag.outputs.tag }}"
          body: |
            Automated build from commit ${{ github.sha }}.

            **Windows x64 release binary** — extract and place alongside your server data folder.
          files: alsteria-canary-windows-x64.zip
          draft: false
          prerelease: false
